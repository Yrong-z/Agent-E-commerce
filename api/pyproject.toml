[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-assistant-api"
version = "0.1.0"
description = "选购助手：合成商品、原生工具调用、真实政策检索与模拟售后"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1", "httpx>=0.28,<1", "openai>=1.60,<3", "mcp>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
